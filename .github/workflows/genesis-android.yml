name: GENESIS Android APK Build & Release

on:
  push:
    branches: ["main"]
    tags: ["*"]        # 모든 태그(*) 푸시 시 빌드 작동하도록 확장
  pull_request:
    branches: ["main"]
  workflow_dispatch:   # 버튼 눌러서 수동 빌드 가능

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write      # Release 생성 및 파일 업로드를 위한 필수 권한

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build SvelteKit App
        run: npm run build

      - name: Ensure Cordova variables file exists
        run: |
          mkdir -p android/capacitor-cordova-android-plugins
          touch android/capacitor-cordova-android-plugins/cordova.variables.gradle

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Sync Capacitor (Android)
        run: npx cap sync android

      - name: Build Android APK (Debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug

      # 1. Actions 탭에 임시 저장 (백업용)
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: genesis-app-${{ github.ref_name }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # 2. GitHub Release(태그 페이지)에 APK 파일 영구 등록
      # push된 것이 '태그'일 때만 실행됩니다.
      - name: Create GitHub Release
        if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          tag_name: ${{ github.ref_name }}
          name: GENESIS Build ${{ github.ref_name }}
          body: |
            태그 `${{ github.ref_name }}`에 대한 자동 빌드 결과물입니다.
            내려받아서 폰에 설치하세요!
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
